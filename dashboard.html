<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f0f3ed">
  <title>Your workspace | Fieldnotes</title>
  <style>
    :root {
      --ink: #202923;
      --muted: #69746c;
      --paper: #fbfcf8;
      --canvas: #f0f3ed;
      --green: #234b3d;
      --green-dark: #18382e;
      --lime: #d9ed9f;
      --line: #dce3d9;
      font-family: "Aptos", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--canvas);
      background-image: radial-gradient(#dce4d9 0.8px, transparent 0.8px);
      background-size: 18px 18px;
    }

    header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(24px, calc((100vw - 1040px) / 2));
      border-bottom: 1px solid var(--line);
      background: rgba(251, 252, 248, 0.94);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--green-dark);
      background: var(--lime);
      font-family: Georgia, serif;
      font-size: 19px;
    }

    .logout {
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--green);
      background: transparent;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }

    .logout:hover { background: #eef3e9; }

    main {
      width: min(100% - 40px, 880px);
      margin: 0 auto;
      padding: clamp(56px, 11vh, 112px) 0 72px;
    }

    .eyebrow {
      margin-bottom: 15px;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 720px;
      margin: 0 0 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 7vw, 68px);
      font-weight: 400;
      line-height: 1.05;
    }

    .welcome-copy {
      max-width: 520px;
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    .workspace {
      margin-top: 64px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .workspace h2 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 650;
    }

    .workspace p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 520px) {
      header { height: 64px; padding: 0 18px; }
      main { width: calc(100% - 36px); }
      .workspace { margin-top: 46px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="brand-mark" aria-hidden="true">f</span> fieldnotes</div>
    <button class="logout" id="logout" type="button">Sign out</button>
  </header>
  <main>
    <p class="eyebrow">Your workspace</p>
    <h1 id="welcome-title">Welcome in.</h1>
    <p class="welcome-copy">You made it. This is your space to gather ideas, make a plan, and keep your next steps close.</p>
    <section class="workspace" aria-label="Workspace status">
      <h2>Ready when you are</h2>
      <p>Your workspace is set up and waiting for your first note.</p>
    </section>
  </main>
  <script>
    const username = sessionStorage.getItem("fieldnotesUsername");

    if (!username) {
      window.location.replace("index.html");
    } else {
      document.querySelector("#welcome-title").textContent = `Welcome in, ${username}.`;
    }

    document.querySelector("#logout").addEventListener("click", () => {
      sessionStorage.removeItem("fieldnotesUsername");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
