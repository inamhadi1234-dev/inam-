<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f3f5ef">
	<title>Sign in | Fieldnotes</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #202923;
			--muted: #69746c;
			--paper: #fbfcf8;
			--canvas: #f0f3ed;
			--green: #234b3d;
			--green-dark: #18382e;
			--lime: #d9ed9f;
			--line: #dce3d9;
			--error: #a33c32;
			font-family: "Aptos", "Segoe UI", sans-serif;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 32px 20px;
			color: var(--ink);
			background-color: var(--canvas);
			background-image: radial-gradient(#dce4d9 0.8px, transparent 0.8px);
			background-size: 18px 18px;
		}

		.layout {
			width: min(100%, 960px);
			min-height: 570px;
			display: grid;
			grid-template-columns: 0.92fr 1.08fr;
			overflow: hidden;
			border: 1px solid rgba(32, 41, 35, 0.08);
			border-radius: 8px;
			background: var(--paper);
			box-shadow: 0 24px 70px rgba(37, 54, 42, 0.12);
		}

		.story {
			position: relative;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			min-width: 0;
			padding: 38px 38px 32px;
			overflow: hidden;
			color: #f8faf4;
			background: var(--green);
		}

		.story::before,
		.story::after {
			position: absolute;
			content: "";
			pointer-events: none;
		}

		.story::before {
			width: 390px;
			height: 390px;
			right: -155px;
			bottom: 60px;
			border: 1px solid rgba(229, 242, 207, 0.23);
			border-radius: 50%;
			box-shadow: 0 0 0 32px rgba(229, 242, 207, 0.035), 0 0 0 64px rgba(229, 242, 207, 0.035), 0 0 0 96px rgba(229, 242, 207, 0.035);
		}

		.story::after {
			right: 48px;
			bottom: 120px;
			width: 86px;
			height: 86px;
			border: 1px solid rgba(229, 242, 207, 0.5);
			border-radius: 50%;
			background: var(--lime);
			box-shadow: 0 0 0 12px rgba(217, 237, 159, 0.08);
		}

		.brand {
			position: relative;
			z-index: 1;
			display: flex;
			align-items: center;
			gap: 11px;
			font-size: 15px;
			font-weight: 650;
			letter-spacing: 0.02em;
		}

		.brand-mark {
			width: 30px;
			height: 30px;
			display: grid;
			place-items: center;
			border-radius: 50%;
			color: var(--green-dark);
			background: var(--lime);
			font-family: Georgia, serif;
			font-size: 19px;
		}

		.story-copy {
			position: relative;
			z-index: 1;
			max-width: 340px;
			margin: 74px 0 80px;
		}

		.eyebrow {
			margin: 0 0 18px;
			color: var(--lime);
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 0.13em;
			text-transform: uppercase;
		}

		h1, h2, p { margin-top: 0; }

		.story h1 {
			max-width: 320px;
			margin-bottom: 16px;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(36px, 4.2vw, 48px);
			font-weight: 400;
			line-height: 1.08;
		}

		.story-copy > p:last-child {
			max-width: 300px;
			margin-bottom: 0;
			color: #d3dfd3;
			font-size: 14px;
			line-height: 1.7;
		}

		.story-foot {
			position: relative;
			z-index: 1;
			margin: 0;
			color: #bdcec0;
			font-size: 11px;
		}

		.form-panel {
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 48px clamp(28px, 6vw, 72px);
		}

		.form-content { width: min(100%, 360px); }

		.form-content h2 {
			margin: 0 0 9px;
			font-family: Georgia, "Times New Roman", serif;
			font-size: 34px;
			font-weight: 400;
			letter-spacing: 0;
		}

		.intro {
			margin-bottom: 34px;
			color: var(--muted);
			font-size: 14px;
			line-height: 1.55;
		}

		.field { margin-bottom: 20px; }

		label {
			display: block;
			margin-bottom: 8px;
			font-size: 12px;
			font-weight: 650;
		}

		input {
			width: 100%;
			height: 48px;
			padding: 0 13px;
			border: 1px solid var(--line);
			border-radius: 5px;
			outline: none;
			color: var(--ink);
			background: #fff;
			font: inherit;
			font-size: 14px;
			transition: border-color 150ms ease, box-shadow 150ms ease;
		}

		input::placeholder { color: #9aa39a; }

		input:focus {
			border-color: var(--green);
			box-shadow: 0 0 0 3px rgba(35, 75, 61, 0.12);
		}

		.password-wrap { position: relative; }

		.password-wrap input { padding-right: 76px; }

		.reveal {
			position: absolute;
			top: 50%;
			right: 11px;
			transform: translateY(-50%);
			padding: 6px 4px;
			border: 0;
			color: var(--green);
			background: transparent;
			font: inherit;
			font-size: 12px;
			font-weight: 650;
			cursor: pointer;
		}

		.reveal:focus-visible, .submit:focus-visible {
			outline: 3px solid rgba(35, 75, 61, 0.25);
			outline-offset: 3px;
		}

		.message {
			min-height: 19px;
			margin: -6px 0 12px;
			color: var(--error);
			font-size: 12px;
		}

		.submit {
			width: 100%;
			height: 49px;
			border: 0;
			border-radius: 5px;
			color: white;
			background: var(--green);
			font: inherit;
			font-size: 14px;
			font-weight: 650;
			cursor: pointer;
			transition: background 150ms ease, transform 150ms ease;
		}

		.submit:hover { background: var(--green-dark); }
		.submit:active { transform: translateY(1px); }

		.demo-note {
			margin: 19px 0 0;
			color: var(--muted);
			font-size: 11px;
			line-height: 1.55;
			text-align: center;
		}

		@media (max-width: 680px) {
			body { padding: 16px; }
			.layout { max-width: 460px; min-height: 0; grid-template-columns: 1fr; }
			.story { min-height: 225px; padding: 24px; }
			.story-copy { margin: 36px 0 22px; }
			.story h1 { max-width: 280px; font-size: 34px; }
			.story-copy > p:last-child { max-width: 280px; font-size: 13px; }
			.story-foot { display: none; }
			.story::before { width: 240px; height: 240px; right: -112px; bottom: -100px; }
			.story::after { width: 52px; height: 52px; right: 35px; bottom: 34px; }
			.form-panel { padding: 34px 24px 30px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>
	<main class="layout">
		<section class="story" aria-label="About Fieldnotes">
			<div class="brand"><span class="brand-mark" aria-hidden="true">f</span> fieldnotes</div>
			<div class="story-copy">
				<p class="eyebrow">A little space to think</p>
				<h1>Make room for what matters.</h1>
				<p>Your ideas, plans, and next steps, gathered in one thoughtful place.</p>
			</div>
			<p class="story-foot">A calmer way to keep things moving.</p>
		</section>

		<section class="form-panel" aria-labelledby="signin-title">
			<div class="form-content">
				<h2 id="signin-title">Welcome back</h2>
				<p class="intro">Sign in to continue to your workspace.</p>
				<form id="login-form">
					<div class="field">
						<label for="username">Username</label>
						<input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username" required>
					</div>
					<div class="field">
						<label for="password">Password</label>
						<div class="password-wrap">
							<input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
							<button class="reveal" id="reveal-password" type="button" aria-pressed="false">Show</button>
						</div>
					</div>
					<p class="message" id="form-message" role="alert" aria-live="polite"></p>
					<button class="submit" type="submit">Sign in</button>
				</form>
				<p class="demo-note">Demo sign-in: enter any username and password to continue.</p>
			</div>
		</section>
	</main>
	<script>
		const loginForm = document.querySelector("#login-form");
		const usernameInput = document.querySelector("#username");
		const passwordInput = document.querySelector("#password");
		const formMessage = document.querySelector("#form-message");
		const revealPassword = document.querySelector("#reveal-password");

		revealPassword.addEventListener("click", () => {
			const isVisible = passwordInput.type === "text";
			passwordInput.type = isVisible ? "password" : "text";
			revealPassword.textContent = isVisible ? "Show" : "Hide";
			revealPassword.setAttribute("aria-pressed", String(!isVisible));
		});

		loginForm.addEventListener("submit", (event) => {
			event.preventDefault();
			formMessage.textContent = "";

			if (!usernameInput.value.trim() || !passwordInput.value) {
				formMessage.textContent = "Enter both your username and password.";
				return;
			}

			sessionStorage.setItem("fieldnotesUsername", usernameInput.value.trim());
			window.location.href = "dashboard.html";
		});
	</script>
</body>
</html>
